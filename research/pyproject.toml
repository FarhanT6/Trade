[project]
name = "meme-research"
version = "0.1.0"
description = "Research / ML layer for the Meme-Coin Trading Intelligence Platform: leakage-safe backtesting, walk-forward validation, feature attribution and Net-EV recalibration."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
